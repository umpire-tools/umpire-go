name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      # Fetches the vendored conformance fixtures pinned by UMPIRE_SPEC_SHA256
      # in the Makefile, so a silent edit to the fixtures fails here instead of
      # in a consumer.
      - name: Sync spec fixtures
        run: make spec-sync

      - name: Test
        run: go test ./...

      - name: Test (race)
        run: go test -race ./...
